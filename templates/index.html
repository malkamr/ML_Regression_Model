<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPL Score Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>IPL First Innings Score Predictor</h1>

        {% if error %}
            <div class="alert">{{ error }}</div>
        {% endif %}

        {% if prediction %}
            <div class="result">
                Predicted final score: <strong>{{ prediction - 5 }} - {{ prediction + 5 }}</strong>
            </div>
        {% endif %}

        <form method="POST">
            <div class="row">
                <div class="field">
                    <label>Batting team</label>
                    <select name="bat_team" required>
                        {% for team in teams %}
                            <option value="{{ team }}">{{ team }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Bowling team</label>
                    <select name="bowl_team" required>
                        {% for team in teams %}
                            <option value="{{ team }}">{{ team }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Overs (5.0 - 19.6)</label>
                    <input type="number" step="0.1" min="5" max="19.6" name="overs" required>
                </div>
                <div class="field">
                    <label>Current runs</label>
                    <input type="number" min="0" name="runs" required>
                </div>
                <div class="field">
                    <label>Wickets fallen</label>
                    <input type="number" min="0" max="10" name="wickets" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Runs in last 5 overs</label>
                    <input type="number" min="0" name="runs_last_5" required>
                </div>
                <div class="field">
                    <label>Wickets in last 5 overs</label>
                    <input type="number" min="0" max="10" name="wickets_last_5" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Striker's runs</label>
                    <input type="number" min="0" name="striker" required>
                </div>
                <div class="field">
                    <label>Non-striker's runs</label>
                    <input type="number" min="0" name="non_striker" required>
                </div>
            </div>

            <button type="submit">Predict Score</button>
        </form>
    </div>
</body>
</html>
